# This line is required. It pulls in default overrides from the embedded cromwell
# `reference.conf` (in core/src/main/resources) needed for proper performance of cromwell.
include required(classpath("application"))

# Cromwell "system" settings
# https://github.com/FredHutch/cromwell-on-slurm/blob/master/crom.config
system {
  file-hash-cache = true

  io {
    number-of-requests = 100000
    per = 5 seconds
    number-of-attempts = 10
  }
}

workflow-options {
  # save all workflow logs to refer back to
  workflow-log-temporary = false
}

call-caching {
  enabled = true
  invalidate-bad-cache-results = true
}

# This is required. Otherwise, it will cause "authentication required" error when using docker.
docker {
  hash-lookup {
    enabled=false
  }
}

backend {
  default = SLURM
  
  providers {
    SLURM {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        concurrent-job-limit = 100

        filesystems {
            docker.allow-soft-links: true

            # An experimental localization strategy called "cached-copy" is also available for SFS backends.
            # This will copy a file to a cache and then hard-link from the cache. It will copy the file to the cache again
            # when the maximum number of hardlinks for a file is reached. The maximum number of hardlinks can be set with:
            # max-hardlinks: 950
            # Try to soft-link (ln -s), then cached-copy, then copy the files.
            localization: [
              "soft-link", "cached-copy", "copy"
            ]

            # Call caching strategies
            caching {
              # When copying a cached result, what type of file duplication should occur. Attempted in the order listed below:
              duplication-strategy: [
                "hard-link", "soft-link", "cached-copy", "copy"
              ]

              # Possible values: file, path, path+modtime
              # "file" will compute an md5 hash of the file content.
              # "path" will compute an md5 hash of the file path. This strategy will only be effective if the duplication-strategy (above) is set to "soft-link",
              # in order to allow for the original file path to be hashed.
              # "path+modtime" will compute an md5 hash of the file path and the last modified time. The same conditions as for "path" apply here.
              # Default: file
              hashing-strategy: "path+modtime"

              # When true, will check if a sibling file with the same name and the .md5 extension exists, and if it does, use the content of this file as a hash.
              # If false or the md5 does not exist, will proceed with the above-defined hashing strategy.
              # Default: false
              check-sibling-md5: false              
            }
          }
        }

        runtime-attributes = """
          Int runtime_minutes = 2160
          Int? cpu = 1
          Int? memory_gb = 8
          String? docker
          String queue = "standard" 
          String cacheLocation = "/data/cqs/softwares/singularity"       
        """

        submit = """
          sbatch \
            --job-name=${job_name} \
            --chdir=${cwd} \
            --output=${cwd}/execution/stdout \
            --error=${cwd}/execution/stderr \
            --time=${runtime_minutes} \
            --nodes=1 \
            --ntasks=${select_first([cpu, 1])} \
            --mem=${memory_gb}G \
            --wrap "/bin/bash ${script}"
        """
        
        # Submit string when there is a "docker" runtime attribute.
        submit-docker = """
          # Cleaning All LIB
          export R_LIBS=
          export PYTHONPATH=
          export JAVA_HOME=

          source /data/cqs/softwares/cqsperl/scripts/set_singularity_cachedir.sh

          # Build the Docker image into a singularity image
          docker_basename=$(basename ${docker})
          docker_subbed=$(sed -e 's/[^A-Za-z0-9._-]/./g' <<< $docker_basename)
          image=${cacheLocation}/$docker_subbed.sif
          lock_path=${cacheLocation}/$docker_subbed.lock

          if [ ! -f "$image" ]; then
            echo $image not exists, please run following command before running the pipeline
            echo singularity pull $image docker://${docker}
            exit 125
          else
            echo $image already exists, great
          fi

          export mybinds=/nobackup,/data

          if [[ -e /v5000 ]]; then
            export mybinds=$mybinds,/v5000
          fi

          if [[ -e /panfs ]]; then
            export mybinds=$mybinds,/panfs
          fi

          # Submit the script to SLURM
          sbatch \
            --job-name=${job_name} \
            --chdir=${cwd} \
            --output=${cwd}/execution/stdout \
            --error=${cwd}/execution/stderr \
            --time=${runtime_minutes} \
            --nodes=1 \
            --ntasks=${select_first([cpu, 1])} \
            --mem=${memory_gb}G \
            --wrap="singularity exec --bind $mybinds,${cwd}:${docker_cwd} $image ${job_shell} ${docker_script}"
        
        """

        # Root directory where Cromwell writes job results.  This directory must be
        # visible and writeable by the Cromwell process as well as the jobs that Cromwell
        # launches.
        root = "cromwell-executions"

        # Root directory where Cromwell writes job results in the container. This value
        # can be used to specify where the execution folder is mounted in the container.
        # it is used for the construction of the docker_cwd string in the submit-docker
        # value above.
        dockerRoot = "/cromwell-executions"

        kill = "scancel ${job_id}"
        check-alive = "squeue -j ${job_id}"
        job-id-regex = "Submitted batch job (\\d+).*"
      }
    }    
  }
}
